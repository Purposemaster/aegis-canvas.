<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Aegis MR Canvas & Mic Test</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene 
      xr-mode-ui="XRMode: xr" 
      webxr="optionalFeatures: passthrough; requiredFeatures: local-floor;"
      background="transparent: true">
      
      <a-sphere 
        position="0 1.2 -1.5" 
        radius="0.3" 
        color="#00FFCC" 
        material="transparent: true; opacity: 0.6; wireframe: true">
      </a-sphere>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Automatically request microphone permissions when the canvas loads
      async function initAudio() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          console.log("Microphone access granted successfully!");
          // Your microphone stream is now open and ready for AEGIS audio pipeline
        } catch (err) {
          console.error("Microphone access denied or error occurred:", err);
        }
      }

      // Initialize mic request on page load
      window.addEventListener('load', initAudio);
    </script>
  </body>
</html>
