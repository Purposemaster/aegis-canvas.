<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Aegis MR Canvas & Voice Stream</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene 
      xr-mode-ui="XRMode: xr" 
      webxr="optionalFeatures: passthrough; requiredFeatures: local-floor;"
      background="transparent: true">
      
      <a-sphere 
        position="0 1.2 -1.5" 
        radius="0.3" 
        color="#00FFCC" 
        material="transparent: true; opacity: 0.6; wireframe: true">
      </a-sphere>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      let socket;

      // This sets up the live phone line to your AI backend
      function connectBackend() {
        // We will replace this placeholder URL with your real server link later!
        socket = new WebSocket('wss://your-aegis-backend-server.com/stream');

        socket.onopen = () => {
          console.log("Connected to AEGIS voice pipeline!");
          initAudio();
        };
      }

      // Your existing working mic code
      async function initAudio() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          console.log("Microphone access granted successfully!");
          
          // Audio processing setup
          const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
          const mediaStreamSource = audioContext.createMediaStreamSource(stream);
          const processor = audioContext.createScriptProcessor(4096, 1, 1);
          
          mediaStreamSource.connect(processor);
          processor.connect(audioContext.destination);

          // This takes your voice chunks and streams them down the live pipe
          processor.onaudioprocess = (e) => {
            const inputData = e.inputBuffer.getChannelData(0);
            const outputData = new Int16Array(inputData.length);
            for (let i = 0; i < inputData.length; i++) {
              outputData[i] = Math.min(1, Math.max(-1, inputData[i])) * 0x7FFF;
            }
            
            if (socket && socket.readyState === WebSocket.OPEN) {
              socket.send(outputData.buffer);
            }
          };

        } catch (err) {
          console.error("Microphone access denied or error occurred:", err);
        }
      }

      // Start by connecting to the backend when the page loads
      window.addEventListener('load', connectBackend);
    </script>
  </body>
</html>
