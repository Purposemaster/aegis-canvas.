
<script>
let socket;

// ==========================================
// 🛡️ AEGIS STATE-PRESERVATION LAYER
// ==========================================
const AegisState = {
  cacheKey: 'aegis_stage_snapshot',
  
  // 1. Snapshot the current state of your 3D primitives
  save: () => {
    const sceneEl = document.querySelector('a-scene');
    if (!sceneEl) return;

    // We track your interactive elements (like the turquoise sphere)
    const primitives = sceneEl.querySelectorAll('a-sphere, a-box, a-cylinder, a-entity');
    const snapshot = [];

    primitives.forEach((el, index) => {
      // Skip the camera entity
      if (el.hasAttribute('camera')) return;

      snapshot.push({
        id: el.id || `primitive_${index}`,
        tagName: el.tagName.toLowerCase(),
        position: el.getAttribute('position'),
        rotation: el.getAttribute('rotation'),
        scale: el.getAttribute('scale'),
        color: el.getAttribute('color')
      });
    });

    localStorage.setItem(AegisState.cacheKey, JSON.stringify(snapshot));
    console.log('🛡️ Aegis: Stage configurations successfully cached.');
  },

  // 2. Instantly restore assets if the mobile browser crashes/refreshes
  restore: () => {
    const savedData = localStorage.getItem(AegisState.cacheKey);
    if (!savedData) return;

    console.warn('⚡ Aegis: WebGL context recovered or refreshed. Restoring spatial assets...');
    const sceneEl = document.querySelector('a-scene');
    if (!sceneEl) return;

    const objects = JSON.parse(savedData);
    objects.forEach(obj => {
      // Check if the element already exists, otherwise rebuild it imperatively
      let el = document.getElementById(obj.id);
      if (!el) {
        el = document.createElement(obj.tagName);
        el.setAttribute('id', obj.id);
        sceneEl.appendChild(el);
      }
      if (obj.position) el.setAttribute('position', obj.position);
      if (obj.rotation) el.setAttribute('rotation', obj.rotation);
      if (obj.scale) el.setAttribute('scale', obj.scale);
      if (obj.color) el.setAttribute('color', obj.color);
    });
  }
};

// ==========================================
// 🔊 EXISTING AUDIO & BACKEND STREAMING LOGIC
// ==========================================
function connectBackend() {
  // Placeholder URL—replace this with your real server link later!
  socket = new WebSocket('wss://your-aegis-backend-server.com/stream');
  socket.onopen = () => {
    console.log("Connected to AEGIS voice pipeline!");
    initAudio();
  };
}

async function initAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    console.log("Microphone access granted successfully!");
    
    const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const mediaStreamSource = audioContext.createMediaStreamSource(stream);
    const processor = audioContext.createScriptProcessor(4096, 1, 1);
    
    mediaStreamSource.connect(processor);
    processor.connect(audioContext.destination);

    processor.onaudioprocess = (e) => {
      const inputData = e.inputBuffer.getChannelData(0);
      const outputData = new Int16Array(inputData.length);
      for (let i = 0; i < inputData.length; i++) {
        outputData[i] = Math.min(1, Math.max(-1, inputData[i])) * 0x7FFF;
      }
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(outputData.buffer);
      }
    };
  } catch (err) {
    console.error("Microphone access denied or error occurred:", err);
  }
}

// ==========================================
// ⏱️ RUNTIME CRASH PROTECTION LIFECYCLE
// ==========================================
window.addEventListener('load', () => {
  // 1. Fire up the audio connection
  connectBackend();
  
  // 2. Look for cached assets to restore immediately on boot
  AegisState.restore();

  // 3. Listen for WebGL context loss errors on the scene canvas
  const sceneEl = document.querySelector('a-scene');
  if (sceneEl) {
    sceneEl.addEventListener('render-target-loaded', () => {
      const canvas = sceneEl.canvas;
      
      canvas.addEventListener('webglcontextlost', (event) => {
        event.preventDefault();
        console.error('🚨 Aegis Warning: WebGL Context Lost (Performance Ceiling Hit). Auto-saving layout.');
        AegisState.save(); // Hard-save everything before the context drops
      }, false);

      canvas.addEventListener('webglcontextrestored', () => {
        AegisState.restore(); // Instant reload the moment WebGL initializes again
      }, false);
    });
  }
});
</script>
</body>
</html>
