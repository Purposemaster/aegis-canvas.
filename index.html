<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Aegis MR Canvas Test</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene xr-mode-ui="XRMode: xr">
      <a-sphere 
        position="0 1.2 -2" 
        radius="0.3" 
        color="#00FFCC" 
        material="transparent: true; opacity: 0.7; wireframe: true">

      <a-entity camera look-controls></a-entity>
    </a-scene>
  </body>
</html>
